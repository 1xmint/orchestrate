schema_version: "1.1"
name: three-tools
description: Build a three-command text tool with tests. The README fixes the rules; the traps are the edge cases it lists.
tags: [bench]
runs: 3
execution:
  max_turns: 60
  timeout_seconds: 1800
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: fixture-seed.sh
